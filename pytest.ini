[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers
# Coloca a raiz do projeto no sys.path para que "from src import ..." e
# "from config import settings" funcionem sem instalar o pacote.
pythonpath = .
markers =
    lento: testes que processam imagens grandes
    acervo: regressao contra as fotos reais em data/ (pulado sem elas)
